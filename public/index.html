<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <!-- EKRAN SIĞDIRMA İÇİN EN KRİTİK ETİKET BURADA -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Editorial Post Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        /* YENİ: MOBİLDE EKRAN KAYMASINI VE TAŞMASINI ÖNLEYEN DÜZELTME */
        html, body { 
            height: 100%; 
            height: -webkit-fill-available; /* iOS Safari için tam dolgu */
            margin: 0; 
            padding: 0; 
            overflow: hidden; /* Dış taşmaları gizle */
        }
        body { font-family: 'Inter', sans-serif; background-color: #050505; color: #E0E0E0; }
        
        .post-canvas-area { border-radius: 2px; box-shadow: 0 25px 50px rgba(0,0,0,0.9); transition: all 0.4s; aspect-ratio: 9/16; width: 260px; max-height: 60vh; }
        .hidden-section { display: none !important; }
        .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; color: #666; transition: color 0.2s; cursor: pointer; background: transparent; border: none; padding: 10px 0; }
        .nav-item:active { transform: scale(0.95); }
        .nav-item * { pointer-events: none; } 
        .nav-item svg { width: 22px; height: 22px; margin-bottom: 3px; }
        .btn-active-luxury { background-color: #FFF !important; color: #000 !important; box-shadow: 0 4px 15px rgba(255, 255, 255, 0.15); transition: all 0.3s ease; }
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 18px; width: 18px; border-radius: 50%; background: #FFF; cursor: pointer; margin-top: -6px; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 6px; cursor: pointer; background: #333; border-radius: 4px; }
        .theme-btn { border: 1px solid #333; transition: all 0.2s; background: #111; }
        .theme-btn.active { border-color: #FFF; transform: scale(0.98); background: #222; }
    </style>
</head>
<body class="flex flex-col relative" id="app-body">

    <header id="main-header" class="flex justify-between items-center px-5 py-3 shrink-0 z-20 border-b border-white/5 bg-[#050505]">
        <h1 class="text-[11px] font-medium tracking-[0.3em] uppercase opacity-90">Editorial Studio</h1>
        <span class="text-[9px] font-bold tracking-[0.2em] bg-green-500/20 text-green-500 border border-green-500/30 px-3 py-1.5 rounded-sm uppercase">STABİL</span>
    </header>

    <main class="flex-1 flex flex-col p-4 relative bg-[#0A0A0A] overflow-y-auto hide-scrollbar">
        <div class="w-full flex items-center justify-center relative py-1 mb-4 mt-2">
            <div id="p-canvas-box" class="post-canvas-area flex flex-col items-center justify-center relative overflow-hidden shrink-0">
                <button id="p-expand-btn" class="p-expand-trigger absolute top-3 right-3 text-black/40 hover:text-black transition active:scale-95 bg-white/20 p-1.5 rounded-sm shadow-sm backdrop-blur-md z-50">
                    <svg class="p-icon-expand w-4 h-4 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg>
                    <svg class="p-icon-shrink w-4 h-4 hidden pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 9V4m0 5H4m5 0L3 3m12 6h5m-5 0V4m0 5l5-5M9 15v5m0-5H4m5 0l-6 6m12-6h5m-5 0v5m0-5l5 5"></path></svg>
                </button>
                <div id="p-content-wrapper" class="w-full relative" style="flex: 1; margin: 0 auto; height: 100%;">
                    <div id="p-icon-container" style="position: absolute; top: 33%; left: 50%; transform: translate(-50%, -50%); display: flex; justify-content: center;">
                        <svg id="headphone-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14v-3a8 8 0 0 1 16 0v3"></path><rect x="2" y="14" width="4" height="5" rx="1"></rect><rect x="18" y="14" width="4" height="5" rx="1"></rect></svg>
                    </div>
                    <div id="p-preview-main" style="position: absolute; top: 45%; width: 100%; display: flex; flex-direction: column; align-items: center;"></div>
                    <div id="p-brand-name" style="position: absolute; top: 88%; width: 100%; display: flex; justify-content: center; font-weight: 300; color: #86868B; font-family: 'Jost', sans-serif; text-transform: uppercase;">
                        art of maxims
                    </div>
                </div>
            </div>
        </div>

        <div id="section-post-controls" class="w-full max-w-sm mx-auto shrink-0 mt-auto pb-4 transition-all duration-300 font-sans flex flex-col">
            <button id="download-post-btn" class="w-full btn-active-luxury py-3.5 rounded-sm font-bold text-xs shadow-xl active:scale-95 transition flex items-center justify-center space-x-2 tracking-[0.15em] uppercase">
                <svg id="download-icon" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                <span id="download-btn-text">VİDEOYU RENDERLA</span>
            </button>
        </div>
    </main>

    <!-- MENÜ ALT KISMA SIFIRLANDI -->
    <nav id="bottom-navbar" class="w-full h-[70px] flex items-center justify-around px-1 shrink-0 border-t border-white/5 font-sans bg-[#050505] pb-safe">

             <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path></svg>

           <span class="text-[8.5px] font-semibold text-center uppercase tracking-[0.15em] mt-1.5">Metin</span>
       </button>

            <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>

    <!-- ESTETİK MODALI -->

                    <button id="align-left" class="align-btn flex-1 py-2 text-[10px] font-bold rounded-sm text-white/50 transition tracking-[0.1em] uppercase">Sol</button>
                    <button id="align-center" class="align-btn flex-1 py-2 text-[10px] font-bold rounded-sm btn-active-luxury transition tracking-[0.1em] uppercase">Orta</button>
                    <button id="align-right" class="align-btn flex-1 py-2 text-[10px] font-bold rounded-sm text-white/50 transition tracking-[0.1em] uppercase">Sağ</button>

            <div class="flex flex-col space-y-3 bg-[#111] p-4 rounded-sm border border-white/5">
                <div class="flex justify-between items-center mb-2"><label class="text-[9px] font-bold text-white/50 uppercase">Punto (Boyut)</label><span id="font-size-display" class="text-[10px] font-bold text-black bg-white px-2 py-0.5 rounded-sm">40px</span></div>

            <div class="flex flex-col space-y-3 bg-[#111] p-4 rounded-sm border border-white/5">
                <div class="flex justify-between items-center mb-2"><label class="text-[9px] font-bold text-white/50 uppercase">Satır Genişliği</label><span id="line-width-display" class="text-[10px] font-bold text-black bg-white px-2 py-0.5 rounded-sm">%60</span></div>
                <input type="range" id="line-width-slider" min="40" max="95" value="60" class="w-full">

            <button id="apply-style-btn" class="w-full btn-active-luxury py-3.5 rounded-sm font-bold text-[11px] mt-2 tracking-[0.2em] uppercase">Kapat & Uygula</button>

    <!-- SES MODALI -->
    <div id="audio-modal" class="hidden-section fixed inset-0 z-[1000] flex items-center justify-center bg-black/95 backdrop-blur-sm p-4 font-sans">
        <div class="bg-[#0A0A0A] rounded-sm w-full max-w-sm flex flex-col overflow-hidden border border-white/10 shadow-2xl p-6 text-center">

             <input type="file" id="audio-upload" accept="audio/*" class="w-full text-sm text-white/50 file:mr-4 file:py-2.5 file:px-4 file:rounded-sm file:border-0 file:text-[10px] file:font-bold file:bg-white file:text-black hover:file:bg-white/80 transition mb-4 cursor-pointer">
             <audio id="audio-player" controls class="w-full hidden-section mb-4 rounded-sm border border-white/10"></audio>

             <button id="close-text-modal" class="w-full bg-[#111] text-white/60 py-3.5 rounded-sm font-bold text-[11px] tracking-[0.2em] uppercase border border-white/10 hover:text-white transition">Kapat</button>
        </div>

    <!-- SENKRONİZASYON MODALI -->
    <div id="sync-fix-modal" class="hidden-section fixed inset-0 z-[1000] flex items-center justify-center bg-black/95 backdrop-blur-sm p-4 font-sans">
        <div class="bg-[#0A0A0A] rounded-sm w-full max-w-sm flex flex-col overflow-hidden border border-white/10 shadow-2xl p-6 text-center">
             <h3 class="font-bold text-white text-[11px] tracking-[0.2em] uppercase mb-2">Hassas Senkronizasyon</h3>
             <button id="wrap-selection-btn" class="w-full bg-[#111] text-white/80 py-2.5 rounded-sm font-bold text-[10px] tracking-[0.1em] uppercase border border-white/10 transition mb-3">
                 [ Seçileni İşaretle ]
             </button>
             <textarea id="full-transcript-box" class="w-full h-40 bg-[#050505] text-white border border-white/40 focus:border-white rounded-sm p-3 text-sm mb-4 resize-none leading-relaxed font-sans"></textarea>
             <button id="apply-sync-btn" class="w-full btn-active-luxury py-3.5 rounded-sm font-bold text-[11px] tracking-[0.2em] uppercase mb-3">Senkronize Et</button>
             <button id="close-sync-modal" class="w-full bg-[#111] text-white/60 py-3.5 rounded-sm font-bold text-[11px] tracking-[0.2em] uppercase border border-white/10 hover:text-white transition">Kapat</button>
        </div>

    <!-- ÖNİZLEME MODALI -->
    <div id="captions-modal" class="hidden-section fixed inset-0 z-[1000] flex items-center justify-center bg-black/95 backdrop-blur-sm p-4 font-sans">
        <div class="bg-[#0A0A0A] rounded-sm w-full max-w-sm flex flex-col overflow-hidden border border-white/10 shadow-2xl p-6 text-center">
             <h3 class="font-bold text-white text-[11px] tracking-[0.2em] uppercase mb-2">Canlı Test</h3>
             <button id="start-karaoke-btn" class="w-full btn-active-luxury py-3.5 rounded-sm font-bold text-[11px] tracking-[0.2em] uppercase mb-3 flex justify-center items-center gap-2">Önizlemeyi Oynat</button>
             <button id="close-captions-modal" class="w-full bg-[#111] text-white/60 py-3.5 rounded-sm font-bold text-[11px] tracking-[0.2em] uppercase border border-white/10 hover:text-white transition">Kapat</button>
        </div>
    </div>

    <script>
        const themes = {
            cream: { id: 'cream', name: 'Alabaster', bg: '#DFDBD2', text: '#1A1A1A', highlight: '#000000' },
            charcoal: { id: 'charcoal', name: 'Charcoal', bg: '#242424', text: '#D0D0D0', highlight: '#EDEDED' },
            olive: { id: 'olive', name: 'Deep Olive', bg: '#2E362D', text: '#D0D0D0', highlight: '#EDEDED' },
            navy: { id: 'navy', name: 'Midnight', bg: '#1A2330', text: '#D0D0D0', highlight: '#EDEDED' }
        };
        let activeTheme = 'cream', currentFontSize = 40, currentLineWidth = 60, textAlignment = "center";
        const fontFam = "'Jost', sans-serif", PHI = 1.618, PREVIEW_OFFSET = 0.10;
        let uploadedAudioFile = null, audioDurationForRender = 0;
        let canvasData = { mainText: "Art of Maxims", activeWordIndex: -1, baseTimestamps: [], alignedTimestamps: [], customChunks: [], lastRenderChunkIndex: 0 };

        function initThemes() {
            const container = document.getElementById('theme-selector');
            Object.values(themes).forEach(t => {
                const btn = document.createElement('button');
                btn.className = `theme-btn flex flex-col items-center justify-center p-3 rounded-sm ${t.id === activeTheme ? 'active' : ''}`;
                btn.onclick = () => { activeTheme = t.id; renderPostSpansToPreview(); document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); document.querySelectorAll('.post-canvas-area').forEach(el => el.style.backgroundColor = t.bg); };
                btn.innerHTML = `<div class="w-7 h-7 rounded-full mb-2" style="background-color: ${t.bg};"></div><span class="text-[7px] text-white/70">${t.name}</span>`;
                container.appendChild(btn);
            });
            document.querySelectorAll('.post-canvas-area').forEach(el => el.style.backgroundColor = themes[activeTheme].bg);
        }

        document.getElementById('font-size-slider').oninput = (e) => { currentFontSize = parseInt(e.target.value); document.getElementById('font-size-display').textContent = currentFontSize + 'px'; renderPostSpansToPreview(); };
        document.getElementById('line-width-slider').oninput = (e) => { currentLineWidth = parseInt(e.target.value); document.getElementById('line-width-display').textContent = '%' + currentLineWidth; renderPostSpansToPreview(); };

        ['align-left', 'align-center', 'align-right'].forEach(id => {
            document.getElementById(id).onclick = (e) => {
                document.querySelectorAll('.align-btn').forEach(b => { b.className = "align-btn flex-1 py-2 text-[10px] font-bold rounded-sm text-white/50 transition tracking-[0.1em] uppercase"; });
                e.target.classList.add('btn-active-luxury'); e.target.classList.remove('text-white/50');
                textAlignment = id.split('-')[1]; renderPostSpansToPreview();
            };
        });

        function updateChunksFromText() {
            const textVal = document.getElementById('text-editor').value;
            const lines = textVal.split('\n');
            let userWordsInfo = [];
            lines.forEach((line, lineIdx) => { line.trim().split(/\s+/).filter(x => x.length > 0).forEach(w => userWordsInfo.push({ word: w, lineIdx: lineIdx })); });

            canvasData.alignedTimestamps = [];
            for (let i = 0; i < userWordsInfo.length; i++) {
                let wt = canvasData.baseTimestamps[i]; 
                if (wt) canvasData.alignedTimestamps.push({ word: userWordsInfo[i].word, start: wt.start, end: wt.end });
                else { let prev = canvasData.alignedTimestamps[i-1]; let s = prev ? prev.end + 0.01 : 0; canvasData.alignedTimestamps.push({ word: userWordsInfo[i].word, start: s, end: s + 0.2 }); }
            }
            for (let i = 0; i < canvasData.alignedTimestamps.length - 1; i++) { if (canvasData.alignedTimestamps[i].end > canvasData.alignedTimestamps[i+1].start) canvasData.alignedTimestamps[i].end = canvasData.alignedTimestamps[i+1].start; }

            canvasData.customChunks = []; let currentLineIdx = -1, currentChunk = null;
            for (let i = 0; i < canvasData.alignedTimestamps.length; i++) {
                if (userWordsInfo[i].lineIdx !== currentLineIdx) {
                    currentLineIdx = userWordsInfo[i].lineIdx;
                    if (currentChunk) { currentChunk.endIndex = i - 1; canvasData.customChunks.push(currentChunk); }
                    currentChunk = { startIndex: i, endIndex: i, words: [] };
                }
                currentChunk.words.push(canvasData.alignedTimestamps[i].word); currentChunk.endIndex = i;
            }
            if (currentChunk) canvasData.customChunks.push(currentChunk);
        }

        const modals = ['audio', 'text-edit', 'sync-fix', 'style', 'captions'];
        modals.forEach(m => {
            document.getElementById(`nav-${m}`).onclick = () => document.getElementById(`${m}-modal`).classList.remove('hidden-section');
            document.getElementById(`close-${m}-modal`).onclick = () => document.getElementById(`${m}-modal`).classList.add('hidden-section');
        });
        document.getElementById('apply-style-btn').onclick = () => document.getElementById('style-modal').classList.add('hidden-section');
        document.getElementById('save-text-btn').onclick = () => { updateChunksFromText(); renderPostSpansToPreview(); document.getElementById('text-edit-modal').classList.add('hidden-section'); };

        document.getElementById('wrap-selection-btn').onclick = () => {
            const tBox = document.getElementById('full-transcript-box');
            if (tBox.selectionStart !== tBox.selectionEnd) {
                const sel = tBox.value.substring(tBox.selectionStart, tBox.selectionEnd);
                tBox.value = tBox.value.substring(0, tBox.selectionStart) + "(" + sel + ")" + tBox.value.substring(tBox.selectionEnd);
            }
        };

        const deepgramApiKey = "9622729dc570ad66c722da34d807f5e002ebd6bb"; 
        const audioPlayer = document.getElementById('audio-player');

        document.getElementById('audio-upload').addEventListener('change', async (e) => {
            const file = e.target.files[0]; if (!file) return;
            uploadedAudioFile = file;
            audioPlayer.src = URL.createObjectURL(file);
            audioPlayer.classList.remove('hidden-section');
            audioPlayer.onloadedmetadata = () => audioDurationForRender = audioPlayer.duration;
            document.getElementById('p-preview-main').innerHTML = '<span style="color:#666;">Deepgram AI Metni Çıkarıyor... ⏳</span>';
            
            try {
                const res = await fetch("https://api.deepgram.com/v1/listen?model=nova-2&smart_format=true", { method: "POST", headers: { "Authorization": `Token ${deepgramApiKey}`, "Content-Type": file.type }, body: file });
                const data = await res.json();
                canvasData.baseTimestamps = data.results.channels[0].alternatives[0].words.map(w => ({ word: w.punctuated_word || w.word, start: w.start, end: w.end }));
                canvasData.mainText = canvasData.baseTimestamps.map(w => w.word).join(" ");
                document.getElementById('full-transcript-box').value = canvasData.mainText;
                
                let def = ""; let wArr = canvasData.mainText.split(" ");
                for(let i=0; i<wArr.length; i+=8) def += wArr.slice(i, i+8).join(" ") + "\n";
                document.getElementById('text-editor').value = def.trim();
                
                updateChunksFromText(); renderPostSpansToPreview();
                alert("Metin çıkarıldı! Düzenleyebilirsiniz.");
            } catch (err) { alert("API Hatası."); }
        });

        let syncFrame;
        function syncK() {
            if (audioPlayer.paused && canvasData.activeWordIndex === -1) return;
            let ct = audioPlayer.currentTime + PREVIEW_OFFSET;
            let idx = -1;
            for (let i = 0; i < canvasData.alignedTimestamps.length; i++) {
                let w = canvasData.alignedTimestamps[i]; let nw = canvasData.alignedTimestamps[i + 1];
                let max = nw ? (nw.start - w.end < 1.0 ? nw.start : w.end + 0.4) : w.end + 0.5;
                if (ct >= w.start && ct < max) { idx = i; break; }
            }
            if (idx !== canvasData.activeWordIndex) { canvasData.activeWordIndex = idx; renderPostSpansToPreview(); }
            syncFrame = requestAnimationFrame(syncK);
        }

        document.getElementById('start-karaoke-btn').onclick = () => { document.getElementById('captions-modal').classList.add('hidden-section'); if(audioPlayer.src){ canvasData.activeWordIndex = -1; audioPlayer.currentTime = 0; audioPlayer.play(); }};
        audioPlayer.onplay = () => syncFrame = requestAnimationFrame(syncK);
        audioPlayer.onpause = () => cancelAnimationFrame(syncFrame);
        
        function renderPostSpansToPreview() {
            const t = themes[activeTheme];
            const pMain = document.getElementById('p-preview-main');
            pMain.innerHTML = ''; 
            const isAudioLoaded = !!audioPlayer.src && canvasData.alignedTimestamps.length > 0;
            let ct = isAudioLoaded ? (audioPlayer.currentTime + PREVIEW_OFFSET) : 0;
            
            let cIdx = 0;
            for (let i = 0; i < canvasData.customChunks.length; i++) {
                let fw = canvasData.alignedTimestamps[canvasData.customChunks[i].startIndex];
                if (fw && ct < fw.start) { cIdx = i; break; }
                cIdx = i;
            }
            if(canvasData.activeWordIndex !== -1) cIdx = canvasData.customChunks.findIndex(c => canvasData.activeWordIndex >= c.startIndex && canvasData.activeWordIndex <= c.endIndex);
            
            let chunk = canvasData.customChunks[cIdx] || { startIndex: 0, words: canvasData.mainText.split(" ") };
            let html = chunk.words.map((w, i) => {
                let isActive = (chunk.startIndex + i === canvasData.activeWordIndex);
                return `<span style="font-weight: 300; ${isActive ? `color: ${t.highlight}; opacity: 1;` : `opacity: 0.85;`}">${w}</span>`;
            }).join(" ");
            
            pMain.innerHTML = `<div style="text-align: ${textAlignment}; font-family: ${fontFam}; font-weight: 300; color: ${t.text}; width: 100%; font-size: ${currentFontSize * PHI * (260/1080)}px; line-height: 1.4;">${html}</div>`;
            
            const svg = document.getElementById('headphone-svg'); svg.style.color = t.text; svg.style.width = (currentFontSize * 1.618 * (260/1080)) + 'px';
            const br = document.getElementById('p-brand-name'); br.style.color = t.text; br.style.fontSize = (currentFontSize / 2.618 * (260/1080)) + 'px';
            document.getElementById('p-canvas-box').style.backgroundColor = t.bg;
        }

        // ================= 🔥 TEK TIKLA İNDİRME MOTORU 🔥 =================
        const socket = io(); 

        let headphoneImgCache = null;
        const loadSVGSync = (color) => {
            return new Promise((resolve) => {
                const svgString = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14v-3a8 8 0 0 1 16 0v3"></path><rect x="2" y="14" width="4" height="5" rx="1"></rect><rect x="18" y="14" width="4" height="5" rx="1"></rect></svg>`;
                const svgBlob = new Blob([svgString], {type: 'image/svg+xml;charset=utf-8'});
                const url = URL.createObjectURL(svgBlob);
                const img = new Image();
                img.onload = () => { headphoneImgCache = img; resolve(img); };
                img.src = url;
            });
        };

        function drawLineObjects(ctx, lineArr, renderActiveIndex, drawX, currentY, normalFont, boldFont, baseColor, activeColor, align, maxWidth, logicalWidth) {
            if (lineArr.length === 0) return;
            let totalWidth = 0; ctx.font = normalFont; const spaceW = ctx.measureText(" ").width;
            lineArr.forEach((wObj, i) => { ctx.font = normalFont; totalWidth += ctx.measureText(wObj.word).width; if(i < lineArr.length - 1) totalWidth += spaceW; });
            let segX = drawX;
            if (align === 'center') segX = (logicalWidth - totalWidth) / 2;
            else if (align === 'right') { let startX = (logicalWidth - maxWidth) / 2; segX = logicalWidth - startX - totalWidth; } 
            else { segX = (logicalWidth - maxWidth) / 2; }
            ctx.textAlign = 'left';
            lineArr.forEach((wObj, i) => {
                let isActive = (wObj.index === renderActiveIndex);
                ctx.font = normalFont; ctx.fillStyle = isActive ? activeColor : baseColor; ctx.globalAlpha = isActive ? 1.0 : 0.85; 
                ctx.fillText(wObj.word, segX, currentY);
                segX += ctx.measureText(wObj.word).width;
                if(i < lineArr.length - 1) { ctx.font = normalFont; segX += ctx.measureText(" ").width; }
            });
            ctx.globalAlpha = 1.0; ctx.textAlign = align; 
        }

        document.getElementById('download-post-btn').addEventListener('click', async () => {
            if (!uploadedAudioFile) return alert("Lütfen önce ses yükleyin.");
            
            const btn = document.getElementById('download-post-btn');
            const txt = document.getElementById('download-btn-text');
            btn.disabled = true; txt.innerText = "⏳ Veriler İletiliyor...";

            const arrayBuffer = await uploadedAudioFile.arrayBuffer();
            socket.emit('audio-upload', { buffer: arrayBuffer }, async () => {
                txt.innerText = "🚀 Render Başladı...";
                socket.emit('start-render', { fps: 30 });
                
                const t = themes[activeTheme];
                await document.fonts.ready;
                await loadSVGSync(t.text);

                const exCanvas = document.createElement('canvas'); exCanvas.width = 1080; exCanvas.height = 1920;
                const exCtx = exCanvas.getContext('2d'); exCtx.imageSmoothingEnabled = true; exCtx.imageSmoothingQuality = 'high';
                const maxWidth = 1080 * (currentLineWidth / 100);
                
                const chunkLayouts = []; 
                if (canvasData.customChunks.length === 0) {
                    const wArr = canvasData.mainText.split(/\s+/).filter(x=>x.length>0);
                    canvasData.customChunks.push({ startIndex: 0, endIndex: wArr.length-1, words: wArr });
                }
                for (let i = 0; i < canvasData.customChunks.length; i++) {
                    const c = canvasData.customChunks[i];
                    const wObjs = c.words.map((w, idx) => ({ word: w, index: c.startIndex + idx }));
                    exCtx.font = `300 ${currentFontSize * PHI}px ${fontFam}`;
                    
                    let lines = []; let currentLine = []; let currentWidth = 0; const spaceW = exCtx.measureText(" ").width;
                    for(let j = 0; j < wObjs.length; j++) {
                        let mw = exCtx.measureText(wObjs[j].word).width;
                        if(currentWidth + mw > maxWidth && currentLine.length > 0) { lines.push(currentLine); currentLine = [wObjs[j]]; currentWidth = mw + spaceW; } 
                        else { currentLine.push(wObjs[j]); currentWidth += mw + spaceW; }
                    }
                    if(currentLine.length > 0) lines.push(currentLine);
                    chunkLayouts.push(lines);
                }

                const totalFrames = Math.ceil(audioDurationForRender * 30);

                for (let i = 0; i < totalFrames; i++) {
                    const currentTime = i / 30;
                    exCtx.fillStyle = t.bg; exCtx.fillRect(0, 0, 1080, 1920);

                    const renderActiveIndex = getPreciseActiveWord(currentTime);
                    let currentChunkIndex = updateActiveChunkIndex(renderActiveIndex, currentTime);
                    const lMain = chunkLayouts[currentChunkIndex] || [];
                    
                    exCtx.save();
                    const brandFontSize = currentFontSize / 2.618;
                    exCtx.font = `300 ${brandFontSize}px ${fontFam}`; exCtx.fillStyle = t.text; exCtx.globalAlpha = 0.5; exCtx.textAlign = "center"; exCtx.textBaseline = "middle";
                    if ('letterSpacing' in exCtx) exCtx.letterSpacing = (brandFontSize * 1.2) + "px";
                    exCtx.fillText("art of maxims", 1080 / 2, 1920 * 0.88);
                    exCtx.restore();

                    exCtx.textBaseline = "middle";
                    const iconSize = currentFontSize * 1.618; let iconY = (1920 * 0.33) - (iconSize / 2); let iconX = (1080 - iconSize) / 2;
                    exCtx.globalAlpha = 0.88; exCtx.drawImage(headphoneImgCache, iconX, iconY, iconSize, iconSize); exCtx.globalAlpha = 1.0;

                    let currentY = 1920 * 0.45; const pLineHeight = currentFontSize * PHI * 1.4;
                    const normMainF = `300 ${currentFontSize * PHI}px ${fontFam}`;

                    if (lMain.length > 0) {
                        lMain.forEach(lineObjArr => {
                            drawLineObjects(exCtx, lineObjArr, renderActiveIndex, 1080/2, currentY, normMainF, normMainF, t.text, t.highlight, textAlignment, maxWidth, 1080);
                            currentY += pLineHeight;
                        });
                    }

                    const dataUrl = exCanvas.toDataURL('image/jpeg', 0.85);
                    await new Promise(r => socket.emit('frame', { image: dataUrl }, r));
                    if (i % 15 === 0) txt.innerText = `⏳ İşleniyor... %${Math.floor((i / totalFrames) * 100)}`;
                }
                socket.emit('finish-frames');
                txt.innerText = "📦 MP4 Mühürleniyor...";
            });
        });

        socket.on('render-complete', (data) => {
            const btn = document.getElementById('download-post-btn');
            const txt = document.getElementById('download-btn-text');
            
            // Tarayıcıdan otomatik indirme!
            const a = document.createElement('a');
            a.href = `/download/${data.id}`;
            a.download = 'Editorial_Reels_Pro.mp4';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            txt.innerText = "✅ GALERİYE İNDİRİLDİ!";
            btn.style.backgroundColor = "#10B981";
            btn.style.color = "#FFFFFF";

            setTimeout(() => {
                txt.innerText = "YENİ VİDEO RENDERLA";
                btn.style.backgroundColor = "#FFF";
                btn.style.color = "#000";
                btn.disabled = false;
                document.getElementById('download-icon').style.display = 'block';
            }, 4000);
        });

        socket.on('render-error', (err) => { alert("Hata: " + err); document.getElementById('download-post-btn').disabled = false; });
        document.addEventListener("DOMContentLoaded", () => { initThemes(); });
    </script>
</body>
